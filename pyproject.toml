[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dct"
version = "0.1.0"
description = "Data Collection Toolkit for FPV Drone Localization System"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mss>=9.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "rich>=13.7",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "keyboard>=0.13; sys_platform == 'win32'",
    "pyserial>=3.5",
    "pymavlink>=2.4",
    "av>=12.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# DXGI/Desktop Duplication-based screen capture (Windows-only).
# Avoids GDI BitBlt cursor-jitter and is significantly cheaper on CPU than mss.
# Install with:  pip install -e .[screen-fast]
screen-fast = [
    "dxcam>=0.0.5; sys_platform == 'win32'",
]

[project.scripts]
dct = "dct.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dct*"]
